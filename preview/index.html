<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微信小游戏 · 本地预览</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #182c32; background: #f2f5f5; }
    body { margin: 0; min-width: 280px; }
    button, select { font: inherit; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; padding: 24px clamp(20px, 5vw, 64px); background: #fff; border-bottom: 1px solid #e1e8e7; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .logo { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: #daf4eb; color: #13745b; font-size: 25px; }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 650; letter-spacing: .02em; }
    .subtitle { margin: 0; color: #7c8d91; font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .status { color: #287d64; background: #edf8f2; border-radius: 20px; padding: 7px 12px; font-size: 12px; }
    .status::before { content: ""; display: inline-block; margin-right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #33a878; }
    select, button { min-height: 36px; padding: 7px 11px; color: #4b6168; background: #fff; border: 1px solid #dbe4e4; border-radius: 8px; font-size: 12px; cursor: pointer; }
    select:focus-visible, button:focus-visible { outline: 2px solid #35ac88; outline-offset: 3px; }
    button:hover { background: #f2f7f5; }
    main { display: flex; flex-direction: column; align-items: center; padding: 30px 12px 36px; }
    .caption { margin: 0 0 16px; color: #8b9a9e; font-size: 11px; letter-spacing: .13em; }
    .phone { padding: 7px; max-width: 100%; border: 1px solid #cfd9da; border-radius: 30px; background: #fff; box-shadow: 0 18px 54px #203b3c13, 0 3px 9px #203b3c09; }
    #game-viewport { width: min(var(--device-width, 390px), calc(100vw - 40px)); aspect-ratio: var(--device-ratio, 390 / 844); position: relative; overflow: hidden; border-radius: 24px; background: #0b182b; }
    #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .note { margin: 20px 0 0; max-width: 430px; color: #85969b; font-size: 12px; line-height: 1.8; text-align: center; }
    @media (max-width: 600px) { .toolbar { padding: 18px; gap: 16px; } .actions { width: 100%; } .status { margin-right: auto; } main { padding-top: 22px; } h1 { font-size: 16px; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">✦</span>
      <div><h1>星星收集</h1><p class="subtitle">v1.1.0 · 微信原生小游戏</p></div>
    </div>
    <div class="actions">
      <span class="status">本地预览</span>
      <select id="device" aria-label="预览屏幕尺寸">
        <option value="375,667">375 × 667</option>
        <option value="390,844" selected>390 × 844</option>
        <option value="430,932">430 × 932</option>
      </select>
      <button type="button" id="reload">↻ 重新载入</button>
    </div>
  </header>
  <main>
    <p class="caption">30 秒星光挑战</p>
    <div class="phone"><div id="game-viewport"><canvas id="game-canvas" aria-label="星星收集小游戏画布">请使用支持 Canvas 的浏览器。</canvas></div></div>
    <p class="note">使用鼠标或触屏操作 · 修改源码后刷新页面<br>微信能力请在微信开发者工具与真机中验证</p>
  </main>
  <script>
    document.getElementById('device').addEventListener('change', function () {
      const values = this.value.split(',').map(Number);
      const viewport = document.getElementById('game-viewport');
      viewport.style.setProperty('--device-width', values[0] + 'px');
      viewport.style.setProperty('--device-ratio', values[0] + ' / ' + values[1]);
    });
    document.getElementById('reload').addEventListener('click', function () { location.reload(); });
  </script>
  <script src="/game.bundle.js" defer></script>
</body>
</html>
